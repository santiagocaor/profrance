<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profesor de Francés IA</title>
  <!-- Fuente Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="./logo.png">
  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="./css/style.css?v=3">
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">

      <button id="close-sidebar-btn" class="mobile-only-btn" title="Cerrar Menú"><span
          class="material-symbols-outlined">close</span></button>

      <h3 class="sidebar-section-title">Módulos</h3>
      <nav id="module-nav">
        <!-- Generado dinámicamente -->
      </nav>

      <div class="settings">
        <label for="api-key">Gemini API Key:</label>
        <input type="password" id="api-key" placeholder="Pega tu API Key aquí">
        <div class="settings-actions" style="margin-top: 0.8rem; display: flex; gap: 0.5rem;">
          <button id="export-btn" class="sidebar-action-btn"
            title="Exportar Lecciones"><span class="material-symbols-outlined">download</span> Exportar</button>
          <button id="import-btn" class="sidebar-action-btn"
            title="Importar Lecciones"><span class="material-symbols-outlined">upload</span> Importar</button>
          <input type="file" id="import-file" style="display: none;" accept=".json">
        </div>

        <div class="user-cloud-sync" id="user-cloud-sync" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
          <div id="auth-logged-out">
            <button id="google-login-btn" class="sidebar-action-btn primary-auth-btn" style="width: 100%; justify-content: center; gap: 0.5rem; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); font-weight: 600; padding: 0.61rem;" title="Sincronizar en la nube entre Móvil y PC">
              <span class="material-symbols-outlined">cloud_sync</span> Sincronizar Móvil / PC
            </button>
          </div>
          <div id="auth-logged-in" class="hidden" style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem; overflow: hidden;">
              <img id="user-avatar" src="" alt="User" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">
              <span id="user-name" style="font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary);">Usuario</span>
            </div>
            <button id="google-logout-btn" class="sidebar-action-btn" title="Cerrar Sesión" style="padding: 0.3rem 0.5rem; min-width: unset;">
              <span class="material-symbols-outlined" style="font-size: 1.1rem;">logout</span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <main class="content-area">
      <header class="module-header">
        <div class="header-top">
          <button id="mobile-menu-btn" class="mobile-only-btn" title="Abrir Menú"><span
              class="material-symbols-outlined">menu</span></button>
          <h2 id="current-module-title">Bienvenido</h2>
        </div>
        <p id="current-module-desc">Selecciona un módulo para comenzar.</p>
      </header>

      <div class="workspace">
        <div class="input-panel" id="input-panel">
          <div class="input-panel-header hidden" id="input-panel-toggle" title="Contraer o expandir texto original">
            <div class="input-panel-header-left">
              <span class="material-symbols-outlined input-panel-header-icon">edit_note</span>
              <span class="input-panel-title" id="input-panel-summary-text">Texto ingresado</span>
            </div>
            <button type="button" class="btn-toggle-input-panel" id="btn-toggle-input-panel" title="Contraer o expandir panel">
              <span class="material-symbols-outlined toggle-chevron">expand_less</span>
            </button>
          </div>
          <form id="input-form">
            <div id="dynamic-inputs"></div>
            <button type="submit" class="btn-primary" id="submit-btn" title="Ejecutar"><span
                class="material-symbols-outlined">send</span></button>
          </form>
        </div>

        <div class="output-panel">
          <div class="output-header">
            <div class="audio-speed-control" id="audio-speed-box" title="Velocidad de reproducción de audio">
              <span class="speed-label"><span class="material-symbols-outlined" style="font-size: 1.15rem; vertical-align: middle;">volume_up</span> Velocidad:</span>
              <button type="button" class="btn-speed" data-rate="0.7" title="Lectura lenta (0.7x)"><span class="material-symbols-outlined">slow_motion_video</span></button>
              <button type="button" class="btn-speed active" data-rate="0.9" title="Lectura normal (0.9x)"><span class="material-symbols-outlined">play_arrow</span></button>
              <button type="button" class="btn-speed" data-rate="1.1" title="Lectura rápida (1.1x)"><span class="material-symbols-outlined">bolt</span></button>
            </div>
            <div class="output-actions">
              <button id="copy-btn" class="hidden" title="Copiar al portapapeles"><span class="material-symbols-outlined">content_copy</span></button>
              <button id="save-btn" class="hidden" title="Guardar Lección"><span class="material-symbols-outlined">bookmark</span></button>
            </div>
          </div>
          <div id="output-content" class="markdown-body">
            <p class="placeholder-text">La respuesta aparecerá aquí...</p>
          </div>
          <div id="loading" class="loading hidden">Pensando...</div>
        </div>
      </div>
    </main>
  </div>
  <!-- marked: versión fija para evitar roturas por actualizaciones automáticas -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- DOMPurify: sanitización de HTML para prevenir inyección de código -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script type="module" src="./main.js?v=4"></script>
</body>

</html>
