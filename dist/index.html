<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profesor de Francés IA</title>
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/logo-DqkzmgPc.png">
  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script type="module" crossorigin src="/assets/index-CCtRSUix.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DCLbeOCr.css">
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <img src="/assets/logo-DqkzmgPc.png" alt="Logo" class="sidebar-logo-img">
        <p>Profesor Nativo IA</p>
      </div>
      <button id="close-sidebar-btn" class="mobile-only-btn" title="Cerrar Menú"><span
          class="material-symbols-outlined">close</span></button>

      <h3 class="sidebar-section-title">Módulos</h3>
      <nav id="module-nav">
        <!-- Generado dinámicamente -->
      </nav>

      <div class="settings">
        <label for="api-key">Gemini API Key:</label>
        <input type="password" id="api-key" placeholder="Pega tu API Key aquí">
        <div class="settings-actions" style="margin-top: 0.8rem; display: flex; gap: 0.5rem;">
          <button id="export-btn" class="sidebar-action-btn"
            title="Exportar Lecciones"><span class="material-symbols-outlined">download</span> Exportar</button>
          <button id="import-btn" class="sidebar-action-btn"
            title="Importar Lecciones"><span class="material-symbols-outlined">upload</span> Importar</button>
          <input type="file" id="import-file" style="display: none;" accept=".json">
        </div>
      </div>
    </aside>

    <main class="content-area">
      <header class="module-header">
        <div class="header-top">
          <button id="mobile-menu-btn" class="mobile-only-btn" title="Abrir Menú"><span
              class="material-symbols-outlined">menu</span></button>
          <h2 id="current-module-title">Bienvenido</h2>
        </div>
        <p id="current-module-desc">Selecciona un módulo para comenzar.</p>
      </header>

      <div class="workspace">
        <div class="input-panel">
          <form id="input-form">
            <div id="dynamic-inputs"></div>
            <button type="submit" class="btn-primary" id="submit-btn" title="Ejecutar"><span
                class="material-symbols-outlined">send</span></button>
          </form>
        </div>

        <div class="output-panel">
          <div class="output-header">
            <div class="audio-speed-control" id="audio-speed-box" title="Velocidad de reproducción de audio">
              <span class="speed-label"><span class="material-symbols-outlined" style="font-size: 1.1rem; vertical-align: middle;">volume_up</span> Velocidad Audio:</span>
              <button type="button" class="btn-speed" data-rate="0.7" title="Lectura lenta (0.7x)">🐢 Lento</button>
              <button type="button" class="btn-speed active" data-rate="0.9" title="Lectura normal (0.9x)">🐇 Normal</button>
              <button type="button" class="btn-speed" data-rate="1.1" title="Lectura rápida (1.1x)">⚡ Rápido</button>
            </div>
            <div class="output-actions">
              <button id="copy-btn" class="hidden" title="Copiar al portapapeles"><span class="material-symbols-outlined">content_copy</span></button>
              <button id="save-btn" class="hidden" title="Guardar Lección"><span class="material-symbols-outlined">bookmark</span></button>
            </div>
          </div>
          <div id="output-content" class="markdown-body">
            <p class="placeholder-text">La respuesta aparecerá aquí...</p>
          </div>
          <div id="loading" class="loading hidden">Pensando...</div>
        </div>
      </div>
    </main>
  </div>
  <!-- marked: versión fija para evitar roturas por actualizaciones automáticas -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- DOMPurify: sanitización de HTML para prevenir inyección de código -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</body>

</html>
